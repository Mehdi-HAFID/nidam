<!DOCTYPE html>
<html dir="ltr" lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Nidam</title>

    <meta name="description" content="Sign in page" />
    <link th:href="@{/images/nidam-svg.svg}" rel="icon" type="image/svg+xml">
    <link th:href="@{/images/nidam-icon-256.ico}" rel="icon" sizes="any">
    <link th:href="@{/images/nidam-180.png}" rel="apple-touch-icon" sizes="180x180"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link th:href="@{/css/login.css}" rel="stylesheet"/>
</head>
<body>

    <div class="auth-card">
        
        <div class="auth-header">
            <!-- Generic overlapping squares icon -->
            <div class="logo-placeholder">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <path d="M9 3v18"></path>
                </svg>
            </div>
            <h1>Welcome back</h1>
            <p>Please enter your details to sign in.</p>
        </div>

        <!-- Spring Security Error Flag -->
        <div class="error-alert" th:if="${LOGIN_ERROR}">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>Invalid email or password.</span>
        </div>

        <!-- Spring Security Form -->
        <form th:action="@{/login}" method="post">
            
            <div class="input-group">
                <!-- placeholder=" " is a CSS hack required for the floating label to work -->
                <input type="email" id="username" name="username" placeholder=" " required autocomplete="email">
                <label for="username">Email address</label>
            </div>

            <div class="input-group">
                <input type="password" id="password" name="password" placeholder=" " required autocomplete="current-password">
                <label for="password">Password</label>
                
                <button type="button" class="password-toggle" onclick="togglePassword()" tabindex="-1" aria-label="Toggle password visibility">
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>Need an account? <a th:href="${@environment.getProperty('react-prefix') + '/signup'}">Sign up</a></p>
        </div>

    </div>

    <!-- Password Visibility Logic -->
    <script th:src="@{/js/login.js}"></script>

</body>
</html>
