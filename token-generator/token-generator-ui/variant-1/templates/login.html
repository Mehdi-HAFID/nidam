<!DOCTYPE html>
<html dir="ltr" lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>Sign in - Nidam</title>

    <meta name="description" content="Sign in page" />
    <link th:href="@{/images/nidam-svg.svg}" rel="icon" type="image/svg+xml">
    <link th:href="@{/images/nidam-icon-256.ico}" rel="icon" sizes="any">
    <link th:href="@{/images/nidam-180.png}" rel="apple-touch-icon" sizes="180x180"/>

    <link rel="icon" type="image/svg+xml" th:href="@{/images/nidam-mark.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="page-shell">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <main class="login-card" aria-labelledby="page-title">
        <div class="brand-mark" aria-hidden="true">
            <img th:src="@{/images/nidam-mark.svg}" alt="">
        </div>

        <div class="heading">
            <p class="eyebrow">Welcome back</p>
            <h1 id="page-title">Sign In</h1>
            <p class="subtitle">Enter your credentials to continue securely.</p>
        </div>

        <section class="error-message"
                 th:if="${LOGIN_ERROR}"
                 role="alert"
                 aria-live="polite">
            <span class="error-icon" aria-hidden="true">!</span>
            <div>
                <strong>Sign in failed</strong>
                <p th:text="${LOGIN_ERROR}">
                    We couldn't verify those credentials. Please check your email and password and try again.
                </p>
            </div>
        </section>

        <form th:action="@{/login}" method="post" class="login-form">
            <div class="field-group">
                <label for="username">Email</label>
                <div class="input-wrap">
                    <span class="field-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                            <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v11a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 17.5v-11Zm2.3-.5L12 10.05 17.7 6H6.3ZM18.5 7.75l-5.92 4.2a1 1 0 0 1-1.16 0L5.5 7.75v9.75c0 .55.45 1 1 1h11c.55 0 1-.45 1-1V7.75Z"/>
                        </svg>
                    </span>
                    <input
                            id="username"
                            name="username"
                            type="email"
                            autocomplete="username"
                            placeholder="you@example.com"
                            required>
                </div>
            </div>

            <div class="field-group">
                <div class="label-row">
                    <label for="password">Password</label>
                </div>

                <div class="input-wrap">
                    <span class="field-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                            <path d="M7.5 10V7.75a4.5 4.5 0 0 1 9 0V10h.75A1.75 1.75 0 0 1 19 11.75v7.5A1.75 1.75 0 0 1 17.25 21h-10A1.75 1.75 0 0 1 5.5 19.25v-7.5A1.75 1.75 0 0 1 7.25 10h.25Zm2 0h5V7.75a2.5 2.5 0 0 0-5 0V10Zm2.5 3a1.75 1.75 0 0 0-1 3.19v1.06h2v-1.06A1.75 1.75 0 0 0 12 13Z"/>
                        </svg>
                    </span>

                    <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required>

                    <button
                            class="password-toggle"
                            type="button"
                            id="toggle-password"
                            aria-controls="password"
                            aria-label="Show password"
                            title="Show password">
                        <svg class="eye-icon eye-open" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M12 5c5.25 0 9.2 4.05 10.5 7-1.3 2.95-5.25 7-10.5 7S2.8 14.95 1.5 12C2.8 9.05 6.75 5 12 5Zm0 2c-4.01 0-6.96 2.7-8.2 5 1.24 2.3 4.19 5 8.2 5s6.96-2.7 8.2-5c-1.24-2.3-4.19-5-8.2-5Zm0 1.75A3.25 3.25 0 1 1 12 15.25a3.25 3.25 0 0 1 0-6.5Zm0 2A1.25 1.25 0 1 0 12 13.25a1.25 1.25 0 0 0 0-2.5Z"/>
                        </svg>
                        <svg class="eye-icon eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="m4.22 3.78 16 16-1.42 1.42-2.36-2.36A10.65 10.65 0 0 1 12 20c-5.25 0-9.2-4.05-10.5-8A13.57 13.57 0 0 1 5.8 6.43L2.8 3.78l1.42-1.42ZM7.3 7.93A11.52 11.52 0 0 0 3.8 12c1.24 2.3 4.19 5 8.2 5 1.18 0 2.28-.22 3.27-.59l-2.03-2.03A3.25 3.25 0 0 1 9.62 10.8L7.3 7.93Zm4.04 4.04 2.17 2.17a1.25 1.25 0 0 0-2.17-2.17Zm5.36 3.36-1.42-1.42c1.27-.69 2.21-1.66 2.92-2.91-1.24-2.3-4.19-5-8.2-5-.36 0-.71.02-1.05.05L7.47 4.57C8.82 4.2 10.33 4 12 4c5.25 0 9.2 4.05 10.5 8-.82 1.86-2.72 4.2-5.8 5.33Z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="sign-in-button">
                <span>Sign In</span>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12h13m-5-5 5 5-5 5"/>
                </svg>
            </button>
        </form>

        <div class="signup-section">
            <span>Need an account?</span>
            <a th:href="${@environment.getProperty('react-prefix') + '/signup'}">
                Sign up
            </a>
        </div>

        <p class="security-note">
            <span class="lock-dot" aria-hidden="true">✓</span>
            Your connection is secured during sign in.
        </p>
    </main>
</div>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
