<!DOCTYPE html>
<html dir="ltr" lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title>Sign in - Nidam</title>

        <meta name="description" content="Sign in page"/>
        <link th:href="@{/images/nidam-svg.svg}" rel="icon" type="image/svg+xml">
        <link th:href="@{/images/nidam-icon-256.ico}" rel="icon" sizes="any">
        <link th:href="@{/images/nidam-180.png}" rel="apple-touch-icon" sizes="180x180"/>

        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
        <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>

        <link rel="stylesheet" th:href="@{/css/login.css}"/>
    </head>
    <body>
        <div class="auth-shell">

            <main class="auth-card">

                <!-- Purely decorative mark. No wordmark on purpose — this page is
                     meant to sit underneath whatever frontend redirects here. -->
                <svg class="auth-card__motif" aria-hidden="true" width="64" height="64" viewBox="0 0 320 320" fill="none">
                    <circle cx="120" cy="150" r="90" stroke="#C9A34E" stroke-opacity="0.9" stroke-width="1.6"/>
                    <circle cx="200" cy="150" r="90" stroke="#C9A34E" stroke-opacity="0.55" stroke-width="1.6"/>
                    <circle cx="160" cy="210" r="90" stroke="#C9A34E" stroke-opacity="0.32" stroke-width="1.6"/>
                    <circle cx="160" cy="150" r="3" fill="#C9A34E"/>
                    <circle cx="140" cy="180" r="2.5" fill="#C9A34E" fill-opacity="0.7"/>
                    <circle cx="180" cy="180" r="2.5" fill="#C9A34E" fill-opacity="0.7"/>
                </svg>

                <h1 class="auth-card__title">Sign in</h1>
                <p class="auth-card__subtitle">Enter your credentials to continue.</p>

                <div class="auth-alert" th:if="${LOGIN_ERROR}" role="alert">
                    <svg class="auth-alert__icon" viewBox="0 0 24 24" width="18" height="18" fill="none"
                         stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                         aria-hidden="true">
                        <path d="M12 9v4"/>
                        <path d="M12 17h.01"/>
                        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/>
                    </svg>
                    <span>Your email or password is incorrect. Please try again.</span>
                </div>

                <form class="auth-form" th:action="@{/login}" method="post" novalidate>

                    <div class="field">
                        <label class="field__label" for="username">Email</label>
                        <input
                                class="field__input"
                                type="email"
                                id="username"
                                name="username"
                                autocomplete="username"
                                placeholder="you@example.com"
                                required
                                autofocus
                        />
                    </div>

                    <div class="field">
                        <label class="field__label" for="password">Password</label>
                        <div class="field__input-group">
                            <input
                                    class="field__input"
                                    type="password"
                                    id="password"
                                    name="password"
                                    autocomplete="current-password"
                                    placeholder="Enter your password"
                                    required
                            />
                            <button
                                    type="button"
                                    class="field__toggle"
                                    id="togglePassword"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                    aria-controls="password"
                            >
                                <svg class="icon icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                                     aria-hidden="true">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                                <svg class="icon icon-eye-off" width="18" height="18" viewBox="0 0 24 24" fill="none"
                                     stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
                                     aria-hidden="true" style="display:none">
                                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06"/>
                                    <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.79 21.79 0 0 1-3.22 4.44"/>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="auth-form__submit">Sign in</button>
                </form>

                <p class="auth-card__footer">
                    Need an account?
                    <a
                            class="auth-card__link"
                            th:href="${@environment.getProperty('react-prefix') + '/signup'}"
                    >Sign up</a>
                </p>

            </main>
        </div>

    <script th:src="@{/js/login.js}"></script>
    </body>
</html>
